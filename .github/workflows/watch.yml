name: Guitar Watch

on:
  schedule:
    # Läuft 3x täglich. Zeiten sind in UTC angegeben.
    # 04:00 / 10:00 / 16:00 UTC entsprechen im Sommer (CEST)
    # ca. 06:00 / 12:00 / 18:00 deutscher Zeit (im Winter eine Stunde früher).
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}
    # Damit kannst du den Lauf auch manuell im "Actions"-Tab per Klick starten,
    # ohne auf den Zeitplan zu warten.

permissions:
  contents: write
  # Wird gebraucht, damit die Action die Ergebnis-Dateien zurück ins Repo
  # committen darf.

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Skript ausführen
        run: python guitar_watch.py
        env:
          REVERB_TOKEN: ${{ secrets.REVERB_TOKEN }}

      - name: Ergebnisse committen (falls es Änderungen gibt)
        run: |
          git config user.name "guitar-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results.md results.json
          git diff --cached --quiet || git commit -m "Update Ergebnisse [automatisch]"
          git push
