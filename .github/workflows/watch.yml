name: Guitar Watch

on:
  schedule:
    # Läuft täglich um 07:00 UTC (≈ 08:00/09:00 deutscher Zeit, je nach Sommerzeit).
    # Format: Minute Stunde Tag Monat Wochentag
    - cron: "0 7 * * *"
  workflow_dispatch: {}
    # Damit kannst du den Lauf auch manuell im "Actions"-Tab per Klick starten,
    # ohne auf den Zeitplan zu warten.

permissions:
  contents: write
  # Wird gebraucht, damit die Action die Ergebnis-Dateien zurück ins Repo
  # committen darf.

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Skript ausführen
        run: python guitar_watch.py

      - name: Ergebnisse committen (falls es Änderungen gibt)
        run: |
          git config user.name "guitar-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results.md results.json
          git diff --cached --quiet || git commit -m "Update Ergebnisse [automatisch]"
          git push
